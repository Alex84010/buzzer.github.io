<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BuzzQuiz — Téléphone</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCX5er97g3SDNUYU_Cg5sQEheRd5wqqqVw",
    authDomain: "buzzquiz-b721a.firebaseapp.com",
    databaseURL: "https://buzzquiz-b721a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "buzzquiz-b721a",
    storageBucket: "buzzquiz-b721a.firebasestorage.app",
    messagingSenderId: "88901394910",
    appId: "1:88901394910:web:5faaa7994e80be6cc93d4f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const params = new URLSearchParams(location.search);
  let ROOM = params.get('room') || '';
  const COLORS = ['#ff6b6b','#ffd166','#06d6a0','#118ab2','#9b5de5'];

  const playerId = 'p_' + Math.random().toString(36).substring(2,8);
  let playerName = '';
  let isHost = false;
  let colorIdx = 0;
  let buzzLocked = false;
  let iAmBuzzer = false;

  // Affiche le code de room s'il est dans l'URL
  if (ROOM) {
    document.getElementById('room-prefill').textContent = ROOM;
    document.getElementById('room-input').value = ROOM;
  }

  // ── REJOINDRE ──
  window.joinGame = async () => {
    const nameVal = document.getElementById('name-input').value.trim();
    const roomVal = document.getElementById('room-input').value.trim().toUpperCase();
    if (!nameVal || !roomVal) { shake('join-form'); return; }

    const roomSnap = await get(ref(db,`rooms/${roomVal}`));
    if (!roomSnap.exists()) { alert("Room introuvable ! Vérifie le code sur la TV."); return; }

    ROOM = roomVal;
    playerName = nameVal;

    // Couleur auto
    const pSnap = await get(ref(db,`rooms/${ROOM}/players`));
    const existing = pSnap.val() || {};
    colorIdx = Object.keys(existing).length % COLORS.length;

    // Est-ce le premier joueur ? → hôte
    const hostSnap = await get(ref(db,`rooms/${ROOM}/host`));
    if (!hostSnap.exists()) {
      isHost = true;
      await set(ref(db,`rooms/${ROOM}/host`), playerId);
    }

    await set(ref(db,`rooms/${ROOM}/players/${playerId}`), { name:playerName, color:colorIdx });

    // Nettoie si l'onglet se ferme
    window.addEventListener('beforeunload', () => {
      // best-effort
      fetch(`https://buzzquiz-b721a-default-rtdb.europe-west1.firebasedatabase.app/rooms/${ROOM}/players/${playerId}.json?auth=`, { method:'DELETE', keepalive:true });
    });

    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('player-name-tag').textContent = playerName;
    document.getElementById('player-dot').style.background = COLORS[colorIdx];

    // Affiche le panneau hôte si c'est lui
    if (isHost) {
      document.getElementById('host-panel').style.display = 'flex';
      document.getElementById('host-badge').style.display = 'inline-block';
    }

    startListeners();
  };

  function startListeners() {
    const r = p => ref(db, `rooms/${ROOM}/${p}`);

    // Question actuelle
    onValue(r('question'), snap => {
      const q = snap.val() || '';
      document.getElementById('current-q').textContent = q || 'En attente d\'une question…';
      document.getElementById('current-q').style.color = q ? '#3d2b1f' : '#c4b49a';
    });

    // Buzz
    onValue(r('buzz'), snap => {
      const buzz = snap.val();
      if (!buzz) {
        buzzLocked = false;
        iAmBuzzer = false;
        showState('ready');
        return;
      }
      if (buzz.playerId === playerId) {
        iAmBuzzer = true;
        showState('answer');
      } else {
        buzzLocked = true;
        iAmBuzzer = false;
        showState('lost', buzz.name);
      }
    });
  }

  // ── ENVOYER QUESTION (hôte) ──
  window.sendQuestion = async () => {
    const q = document.getElementById('question-input').value.trim();
    if (!q) { shake('question-input'); return; }
    await set(ref(db,`rooms/${ROOM}/question`), q);
    await remove(ref(db,`rooms/${ROOM}/buzz`));
    document.getElementById('question-input').value = '';
    document.getElementById('question-input').blur();
  };

  window.clearQuestion = async () => {
    await set(ref(db,`rooms/${ROOM}/question`), '');
    await remove(ref(db,`rooms/${ROOM}/buzz`));
  };

  // ── BUZZER ──
  window.doBuzz = async () => {
    if (!playerName || buzzLocked) return;
    const buzzRef = ref(db,`rooms/${ROOM}/buzz`);
    const snap = await get(buzzRef);
    if (snap.exists()) { buzzLocked = true; showState('lost', snap.val().name); return; }
    buzzLocked = true;
    iAmBuzzer = true;
    await set(buzzRef, { name:playerName, playerId, answer:'', time:Date.now() });
    if (navigator.vibrate) navigator.vibrate([60,20,80]);
    showState('answer');
  };

  // ── ENVOYER RÉPONSE ──
  window.sendAnswer = async () => {
    const ans = document.getElementById('answer-input').value.trim();
    if (!ans) { shake('answer-input'); return; }
    await set(ref(db,`rooms/${ROOM}/buzz/answer`), ans);
    document.getElementById('answer-given').textContent = ans;
    showState('waiting', ans);
  };

  // ── STATES ──
  function showState(state, extra) {
    ['state-ready','state-answer','state-waiting','state-lost'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    if (state==='ready')   document.getElementById('state-ready').style.display='flex';
    if (state==='answer')  { document.getElementById('state-answer').style.display='flex'; setTimeout(()=>document.getElementById('answer-input').focus(),150); }
    if (state==='waiting') { document.getElementById('state-waiting').style.display='flex'; document.getElementById('answer-given').textContent = extra||''; }
    if (state==='lost')    { document.getElementById('state-lost').style.display='flex'; document.getElementById('lost-name').textContent = extra||'???'; }
  }

  // ── SHAKE ANIMATION ──
  function shake(id) {
    const el = document.getElementById(id);
    el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:300});
  }

  // Enter dans les champs
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('room-input').focus(); });
    document.getElementById('room-input').addEventListener('keydown', e => { if(e.key==='Enter') window.joinGame(); });
    document.getElementById('question-input')?.addEventListener('keydown', e => { if(e.key==='Enter') window.sendQuestion(); });
    document.getElementById('answer-input')?.addEventListener('keydown', e => { if(e.key==='Enter') window.sendAnswer(); });
  });
</script>

<style>
:root { --pc: #e63946; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'Nunito',sans-serif;
  background:#fdf6e3; color:#3d2b1f;
  height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
}
body::before {
  content:''; position:fixed; inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(160,140,100,0.15) 32px);
  pointer-events:none; z-index:0;
}

/* ── JOIN ── */
#join-screen {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:24px; padding:28px 24px;
  position:relative; z-index:1;
}

.logo {
  font-family:'Gaegu',cursive; font-size:2.6rem; font-weight:700;
  color:#e63946; transform:rotate(-2deg);
  text-shadow:2px 2px 0 rgba(230,57,70,.2);
}
.logo span { color:#118ab2; }

#join-form {
  display:flex; flex-direction:column; gap:12px;
  width:100%; max-width:320px;
}

.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; font-weight:700; }

.field input {
  font-family:'Gaegu',cursive; font-size:1.5rem;
  background:white; border:2px solid #e0d0a8; border-radius:10px;
  padding:12px 16px; color:#3d2b1f; outline:none; width:100%;
  box-shadow:3px 3px 0 #e0d0a8; transition:border-color .2s;
  text-transform:uppercase;
}
.field input#name-input { text-transform:none; }
.field input:focus { border-color:#e63946; }
.field input::placeholder { color:#c4b49a; text-transform:none; }

.join-btn {
  font-family:'Gaegu',cursive; font-size:1.3rem; font-weight:700;
  background:#e63946; color:white; border:none; border-radius:12px;
  padding:14px; cursor:pointer; width:100%;
  box-shadow:4px 4px 0 #9b1d24; transition:transform .1s,box-shadow .1s;
}
.join-btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #9b1d24; }

/* ── GAME ── */
#game-screen {
  flex:1; display:none; flex-direction:column;
  position:relative; z-index:1; overflow:hidden;
}

/* Header jeu */
.game-top {
  padding:12px 18px 10px;
  border-bottom:2px solid #e0d0a8;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
  background:#fdf6e3;
}
#player-dot { width:12px; height:12px; border-radius:50%; background:var(--pc); flex-shrink:0; }
#player-name-tag { font-family:'Gaegu',cursive; font-size:1.2rem; font-weight:700; }
#host-badge {
  display:none; background:#ffd166; color:#3d2b1f;
  font-size:.65rem; font-weight:700; letter-spacing:1px;
  padding:3px 10px; border-radius:12px; text-transform:uppercase;
  box-shadow:2px 2px 0 #c4a000;
}

/* Question display strip */
.q-strip {
  margin:12px 16px 0;
  background:white; border:2px solid #e0d0a8; border-radius:12px;
  padding:10px 14px; box-shadow:3px 3px 0 #e0d0a8; flex-shrink:0;
}
.q-strip-label { font-size:.55rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; font-weight:700; margin-bottom:2px; }
#current-q { font-family:'Gaegu',cursive; font-size:1.1rem; line-height:1.3; }

/* Host panel */
#host-panel {
  display:none; flex-direction:column; gap:8px;
  margin:12px 16px 0; flex-shrink:0;
  background:#fff8e1; border:2px solid #ffd166;
  border-radius:12px; padding:12px 14px;
  box-shadow:3px 3px 0 #ffd166;
}
.host-label { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; font-weight:700; }
.host-input-row { display:flex; gap:8px; }
#question-input {
  flex:1; font-family:'Gaegu',cursive; font-size:1.1rem;
  background:white; border:2px solid #e0d0a8; border-radius:8px;
  padding:9px 12px; color:#3d2b1f; outline:none;
  box-shadow:2px 2px 0 #e0d0a8; transition:border-color .2s;
}
#question-input:focus { border-color:#ffd166; }
#question-input::placeholder { color:#c4b49a; font-size:.95rem; }
.host-btn {
  font-family:'Gaegu',cursive; font-size:.95rem; font-weight:700;
  border:none; border-radius:8px; padding:9px 14px; cursor:pointer;
  white-space:nowrap; transition:transform .1s,box-shadow .1s;
}
.hb-send  { background:#e63946; color:white; box-shadow:3px 3px 0 #9b1d24; }
.hb-send:active  { transform:translate(2px,2px); box-shadow:1px 1px 0 #9b1d24; }
.hb-clear { background:#c4b49a; color:white; box-shadow:3px 3px 0 #8a7a60; }
.hb-clear:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #8a7a60; }

/* States */
.states {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:12px 16px; overflow:hidden;
}

/* STATE READY */
#state-ready { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
.buzz-hint { font-size:.75rem; color:#a89880; letter-spacing:1px; text-align:center; }

.buzz-btn {
  width:min(200px,62vw); height:min(200px,62vw);
  border-radius:50%; border:none;
  background:radial-gradient(circle at 35% 35%, #ff8f9a, #e63946);
  color:white; font-family:'Gaegu',cursive; font-size:2.2rem; font-weight:700;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  box-shadow:0 7px 0 rgba(0,0,0,.25), 0 14px 30px rgba(230,57,70,.35), inset 0 -4px 8px rgba(0,0,0,.2);
  animation:breathe 2.5s ease-in-out infinite;
  position:relative; overflow:hidden;
}
.buzz-btn::before {
  content:''; position:absolute; top:10%; left:15%; width:35%; height:18%;
  background:rgba(255,255,255,.25); border-radius:50%; transform:rotate(-20deg);
}
@keyframes breathe {
  0%,100%{transform:scale(1);box-shadow:0 7px 0 rgba(0,0,0,.25),0 14px 30px rgba(230,57,70,.35),inset 0 -4px 8px rgba(0,0,0,.2);}
  50%{transform:scale(1.06);box-shadow:0 7px 0 rgba(0,0,0,.25),0 22px 50px rgba(230,57,70,.5),inset 0 -4px 8px rgba(0,0,0,.2);}
}
.buzz-btn:active {
  transform:scale(.92) translateY(6px)!important;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(230,57,70,.2),inset 0 -2px 4px rgba(0,0,0,.2)!important;
  animation:none!important;
}

/* STATE ANSWER */
#state-answer { display:none; flex-direction:column; align-items:center; gap:14px; width:100%; }
.answer-card {
  background:white; border:3px solid #e0d0a8; border-radius:16px;
  padding:20px; box-shadow:5px 5px 0 #e0d0a8; width:100%; max-width:320px; text-align:center;
}
.ac-title { font-family:'Gaegu',cursive; font-size:1.6rem; color:#e63946; margin-bottom:2px; }
.ac-sub   { font-size:.7rem; color:#a89880; letter-spacing:1px; margin-bottom:14px; }
#answer-input {
  font-family:'Gaegu',cursive; font-size:1.3rem;
  background:#fdf6e3; border:2px solid #e0d0a8; border-radius:10px;
  padding:11px 14px; color:#3d2b1f; outline:none; width:100%;
  box-shadow:2px 2px 0 #e0d0a8; transition:border-color .2s;
  margin-bottom:10px; text-align:center;
}
#answer-input:focus { border-color:#e63946; }
#answer-input::placeholder { color:#c4b49a; font-size:1rem; }
.send-ans-btn {
  font-family:'Gaegu',cursive; font-size:1.15rem; font-weight:700;
  background:#06d6a0; color:white; border:none; border-radius:10px;
  padding:12px 0; width:100%; cursor:pointer;
  box-shadow:4px 4px 0 #048a66; transition:transform .1s,box-shadow .1s;
}
.send-ans-btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #048a66; }

/* STATE WAITING */
#state-waiting { display:none; flex-direction:column; align-items:center; gap:14px; text-align:center; }
.wait-card {
  background:white; border:3px solid #ffd166; border-radius:16px;
  padding:24px 28px; box-shadow:5px 5px 0 #ffd166; max-width:280px;
}
.wc-icon  { font-size:2.4rem; margin-bottom:8px; }
.wc-title { font-family:'Gaegu',cursive; font-size:1.3rem; margin-bottom:10px; }
.wc-label { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
#answer-given { font-family:'Gaegu',cursive; font-size:1.6rem; color:#118ab2; }

/* STATE LOST */
#state-lost { display:none; flex-direction:column; align-items:center; gap:14px; text-align:center; }
.lost-card {
  background:white; border:3px solid #e0d0a8; border-radius:16px;
  padding:24px 28px; box-shadow:5px 5px 0 #e0d0a8; max-width:280px;
}
.lc-icon  { font-size:2.4rem; margin-bottom:8px; }
.lc-title { font-family:'Gaegu',cursive; font-size:1.1rem; color:#a89880; margin-bottom:4px; }
#lost-name { font-family:'Gaegu',cursive; font-size:1.8rem; color:#e63946; font-weight:700; }
.lc-sub   { font-size:.7rem; color:#c4b49a; letter-spacing:1px; margin-top:6px; }
</style>
</head>
<body>

<!-- ── JOIN ── -->
<div id="join-screen">
  <div class="logo">✏️ Buzz<span>Quiz</span></div>

  <div id="join-form">
    <div class="field">
      <label for="name-input">Ton prénom</label>
      <input id="name-input" type="text" placeholder="Ex: Léa" maxlength="14" autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <div class="field">
      <label for="room-input">Code de la room</label>
      <input id="room-input" type="text" placeholder="Ex: AB12" maxlength="6" autocomplete="off" autocorrect="off" spellcheck="false" />
      <small id="room-prefill" style="font-size:.65rem;color:#06d6a0;letter-spacing:1px;margin-top:2px;display:none"></small>
    </div>
    <button class="join-btn" onclick="joinGame()">Rejoindre ! →</button>
  </div>
</div>

<!-- ── GAME ── -->
<div id="game-screen">

  <div class="game-top">
    <div id="player-dot"></div>
    <div id="player-name-tag">???</div>
    <span id="host-badge">⭐ Hôte</span>
  </div>

  <div class="q-strip">
    <div class="q-strip-label">📋 Question</div>
    <div id="current-q">En attente d'une question…</div>
  </div>

  <!-- Panneau hôte (premier joueur connecté) -->
  <div id="host-panel">
    <div class="host-label">⭐ Tu es l'hôte — écris la question</div>
    <div class="host-input-row">
      <input id="question-input" type="text" placeholder="Ta question ici…" autocomplete="off" />
      <button class="host-btn hb-send"  onclick="sendQuestion()">Envoyer</button>
      <button class="host-btn hb-clear" onclick="clearQuestion()">↺</button>
    </div>
  </div>

  <!-- Zone d'état -->
  <div class="states">

    <!-- READY -->
    <div id="state-ready">
      <div class="buzz-hint">Appuie dès que tu connais la réponse !</div>
      <button class="buzz-btn" onclick="doBuzz()">BUZZ!</button>
    </div>

    <!-- ANSWER -->
    <div id="state-answer">
      <div class="answer-card">
        <div class="ac-title">⚡ Tu as buzzé !</div>
        <div class="ac-sub">Écris ta réponse vite !</div>
        <input id="answer-input" type="text" placeholder="Ta réponse…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button class="send-ans-btn" onclick="sendAnswer()">Envoyer ma réponse !</button>
      </div>
    </div>

    <!-- WAITING -->
    <div id="state-waiting">
      <div class="wait-card">
        <div class="wc-icon">⏳</div>
        <div class="wc-title">En attente du verdict…</div>
        <div class="wc-label">Ta réponse</div>
        <div id="answer-given">…</div>
      </div>
    </div>

    <!-- LOST -->
    <div id="state-lost">
      <div class="lost-card">
        <div class="lc-icon">😬</div>
        <div class="lc-title">Trop lent… c'est</div>
        <div id="lost-name">???</div>
        <div class="lc-sub">qui a buzzé en premier !</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
