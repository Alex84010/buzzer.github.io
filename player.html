<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BuzzQuiz — Téléphone</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCX5er97g3SDNUYU_Cg5sQEheRd5wqqqVw",
    authDomain: "buzzquiz-b721a.firebaseapp.com",
    databaseURL: "https://buzzquiz-b721a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "buzzquiz-b721a",
    storageBucket: "buzzquiz-b721a.firebasestorage.app",
    messagingSenderId: "88901394910",
    appId: "1:88901394910:web:5faaa7994e80be6cc93d4f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const params = new URLSearchParams(location.search);
  const ROOM = params.get('room') || '';
  const playerId = 'p_' + Math.random().toString(36).substring(2,8);
  let playerName = '';
  let hasJoined = false;
  let isBuzzer = false;
  let buzzLocked = false;

  const COLORS = ['#ff6b6b','#ffd166','#06d6a0','#118ab2','#9b5de5'];

  document.getElementById('room-display').textContent = ROOM || '???';

  window.joinGame = async () => {
    const val = document.getElementById('name-input').value.trim();
    if (!val || !ROOM) return;

    const roomSnap = await get(ref(db,`rooms/${ROOM}`));
    if (!roomSnap.exists()) { alert("Room introuvable !"); return; }

    // Attribue une couleur selon le nombre de joueurs existants
    const playersSnap = await get(ref(db,`rooms/${ROOM}/players`));
    const players = playersSnap.val() || {};
    const colorIdx = Object.keys(players).length % COLORS.length;

    playerName = val;
    await set(ref(db,`rooms/${ROOM}/players/${playerId}`), { name:playerName, color:colorIdx });
    hasJoined = true;

    // Couleur du joueur
    document.documentElement.style.setProperty('--player-color', COLORS[colorIdx]);
    document.getElementById('player-name-display').textContent = playerName;

    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';

    // Écoute la question
    onValue(ref(db,`rooms/${ROOM}/question`), snap => {
      const q = snap.val() || '';
      document.getElementById('current-question').textContent = q || 'En attente d\'une question…';
    });

    // Écoute le buzz
    onValue(ref(db,`rooms/${ROOM}/buzz`), snap => {
      const buzz = snap.val();
      if (!buzz) {
        buzzLocked = false;
        isBuzzer = false;
        showState('ready');
      } else if (buzz.playerId === playerId) {
        isBuzzer = true;
        showState('answer');
      } else {
        buzzLocked = true;
        isBuzzer = false;
        showState('lost', buzz.name);
      }
    });
  };

  window.doBuzz = async () => {
    if (!hasJoined || buzzLocked) return;
    const buzzRef = ref(db,`rooms/${ROOM}/buzz`);
    const snap = await get(buzzRef);
    if (snap.exists()) { buzzLocked = true; return; }

    buzzLocked = true;
    await set(buzzRef, { name:playerName, playerId, answer:'', time:Date.now() });
    if (navigator.vibrate) navigator.vibrate([60,20,60]);
    showState('answer');
  };

  window.sendAnswer = async () => {
    const ans = document.getElementById('answer-input').value.trim();
    if (!ans || !isBuzzer) return;
    await set(ref(db,`rooms/${ROOM}/buzz/answer`), ans);
    showState('waiting-judge', ans);
  };

  function showState(state, extra) {
    document.getElementById('state-ready').style.display   = 'none';
    document.getElementById('state-answer').style.display  = 'none';
    document.getElementById('state-waiting').style.display = 'none';
    document.getElementById('state-lost').style.display    = 'none';

    if (state==='ready')         { document.getElementById('state-ready').style.display='flex'; }
    else if (state==='answer')   { document.getElementById('state-answer').style.display='flex'; setTimeout(()=>document.getElementById('answer-input').focus(),100); }
    else if (state==='waiting-judge') {
      document.getElementById('state-waiting').style.display='flex';
      document.getElementById('answer-given').textContent = extra || '';
    }
    else if (state==='lost') {
      document.getElementById('state-lost').style.display='flex';
      document.getElementById('lost-who').textContent = extra || '???';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('name-input').addEventListener('keydown', e => { if(e.key==='Enter') window.joinGame(); });
    document.getElementById('answer-input')?.addEventListener('keydown', e => { if(e.key==='Enter') window.sendAnswer(); });
  });
</script>

<style>
:root { --player-color: #e63946; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:'Nunito',sans-serif;
  background:#fdf6e3;
  color:#3d2b1f;
  height:100dvh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* Lignes cahier */
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(160,140,100,0.15) 32px);
  pointer-events:none; z-index:0;
}

/* ── JOIN SCREEN ── */
#join-screen {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:28px; padding:32px 24px;
  position:relative; z-index:1;
}

.logo {
  font-family:'Gaegu',cursive; font-size:2.4rem; font-weight:700;
  color:#e63946; transform:rotate(-2deg); display:inline-block;
  text-shadow:2px 2px 0 rgba(230,57,70,.2);
}
.logo span { color:#118ab2; }

.room-pill {
  background:white; border:3px solid #e0d0a8; border-radius:14px;
  padding:10px 24px; text-align:center;
  box-shadow:4px 4px 0 #e0d0a8;
}
.room-pill .rl { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; }
.room-pill .rc { font-family:'Gaegu',cursive; font-size:1.8rem; font-weight:700; color:#118ab2; letter-spacing:5px; }

.join-form { display:flex; flex-direction:column; gap:12px; width:100%; max-width:300px; }
.join-form label { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; font-weight:700; }

.join-form input {
  font-family:'Gaegu',cursive; font-size:1.5rem;
  background:white; border:2px solid #e0d0a8; border-radius:10px;
  padding:12px 16px; color:#3d2b1f; outline:none; width:100%;
  box-shadow:3px 3px 0 #e0d0a8; transition:border-color .2s;
}
.join-form input:focus { border-color:#e63946; }
.join-form input::placeholder { color:#c4b49a; }

.join-btn {
  font-family:'Gaegu',cursive; font-size:1.3rem; font-weight:700;
  background:#e63946; color:white; border:none; border-radius:12px;
  padding:14px; cursor:pointer;
  box-shadow:4px 4px 0 #9b1d24; transition:transform .1s,box-shadow .1s;
}
.join-btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #9b1d24; }

/* ── GAME SCREEN ── */
#game-screen {
  flex:1; display:none; flex-direction:column;
  position:relative; z-index:1;
}

.game-header {
  padding:16px 20px 10px;
  border-bottom:2px solid #e0d0a8;
  display:flex; align-items:center; gap:10px;
}
.player-dot { width:14px; height:14px; border-radius:50%; background:var(--player-color); flex-shrink:0; }
#player-name-display { font-family:'Gaegu',cursive; font-size:1.3rem; font-weight:700; }

.question-strip {
  background:white; margin:14px 16px;
  border:2px solid #e0d0a8; border-radius:12px;
  padding:12px 16px; box-shadow:3px 3px 0 #e0d0a8;
}
.qs-label { font-size:.58rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; font-weight:700; margin-bottom:4px; }
#current-question { font-family:'Gaegu',cursive; font-size:1.15rem; color:#3d2b1f; line-height:1.3; }

/* States area */
.states {
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:16px;
}

/* ── STATE: READY (buzzer) ── */
#state-ready {
  display:flex; flex-direction:column; align-items:center; gap:20px;
  width:100%;
}
.buzz-hint { font-size:.7rem; color:#a89880; letter-spacing:1px; text-align:center; }

.buzz-btn {
  width:min(240px,70vw); height:min(240px,70vw);
  border-radius:50%; border:none;
  background:radial-gradient(circle at 35% 35%, #ff8f9a, var(--player-color));
  color:white; font-family:'Gaegu',cursive; font-size:2.4rem; font-weight:700;
  cursor:pointer; user-select:none; -webkit-user-select:none;
  box-shadow:0 8px 0 rgba(0,0,0,.25), 0 16px 40px rgba(230,57,70,.3), inset 0 -4px 8px rgba(0,0,0,.2);
  animation:breathe 2.5s ease-in-out infinite;
  position:relative; overflow:hidden;
  transition:transform .1s, box-shadow .1s;
}
.buzz-btn::before {
  content:'';
  position:absolute; top:10%; left:15%; width:35%; height:20%;
  background:rgba(255,255,255,.25); border-radius:50%;
  transform:rotate(-20deg);
}
@keyframes breathe {
  0%,100% { transform:scale(1); box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 40px rgba(230,57,70,.3),inset 0 -4px 8px rgba(0,0,0,.2); }
  50%      { transform:scale(1.05); box-shadow:0 8px 0 rgba(0,0,0,.25),0 24px 60px rgba(230,57,70,.45),inset 0 -4px 8px rgba(0,0,0,.2); }
}
.buzz-btn:active {
  transform:scale(.93) translateY(6px) !important;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(230,57,70,.2),inset 0 -2px 4px rgba(0,0,0,.2) !important;
  animation:none !important;
}

/* ── STATE: ANSWER ── */
#state-answer {
  display:none; flex-direction:column; align-items:center; gap:18px;
  width:100%;
}
.answer-card {
  background:white; border:3px solid #e0d0a8; border-radius:16px;
  padding:20px; box-shadow:5px 5px 0 #e0d0a8; width:100%; max-width:320px;
  text-align:center;
}
.answer-card .ac-title { font-family:'Gaegu',cursive; font-size:1.6rem; color:#e63946; margin-bottom:4px; }
.answer-card .ac-sub   { font-size:.7rem; color:#a89880; letter-spacing:1px; margin-bottom:14px; }

#answer-input {
  font-family:'Gaegu',cursive; font-size:1.4rem;
  background:#fdf6e3; border:2px solid #e0d0a8; border-radius:10px;
  padding:12px 14px; color:#3d2b1f; outline:none; width:100%;
  box-shadow:2px 2px 0 #e0d0a8; transition:border-color .2s;
  margin-bottom:12px; text-align:center;
}
#answer-input:focus { border-color:#e63946; }
#answer-input::placeholder { color:#c4b49a; }

.send-answer-btn {
  font-family:'Gaegu',cursive; font-size:1.2rem; font-weight:700;
  background:#06d6a0; color:white; border:none; border-radius:10px;
  padding:12px 0; width:100%; cursor:pointer;
  box-shadow:4px 4px 0 #048a66; transition:transform .1s,box-shadow .1s;
}
.send-answer-btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #048a66; }

/* ── STATE: WAITING JUDGE ── */
#state-waiting {
  display:none; flex-direction:column; align-items:center; gap:16px; text-align:center;
}
.waiting-card {
  background:white; border:3px solid #ffd166; border-radius:16px;
  padding:24px; box-shadow:5px 5px 0 #ffd166; max-width:280px;
}
.wc-emoji { font-size:2.5rem; margin-bottom:8px; }
.wc-title { font-family:'Gaegu',cursive; font-size:1.4rem; color:#3d2b1f; margin-bottom:10px; }
.wc-label { font-size:.6rem; color:#a89880; letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; }
#answer-given { font-family:'Gaegu',cursive; font-size:1.6rem; color:#118ab2; }

/* ── STATE: LOST ── */
#state-lost {
  display:none; flex-direction:column; align-items:center; gap:16px; text-align:center;
}
.lost-card {
  background:white; border:3px solid #e0d0a8; border-radius:16px;
  padding:24px; box-shadow:5px 5px 0 #e0d0a8; max-width:280px;
}
.lc-emoji { font-size:2.5rem; margin-bottom:8px; }
.lc-title { font-family:'Gaegu',cursive; font-size:1.2rem; color:#a89880; margin-bottom:6px; }
#lost-who { font-family:'Gaegu',cursive; font-size:1.8rem; color:#e63946; }
.lc-sub { font-size:.7rem; color:#c4b49a; letter-spacing:1px; margin-top:6px; }
</style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen">
  <div class="logo">✏️ Buzz<span>Quiz</span></div>

  <div class="room-pill">
    <div class="rl">Room</div>
    <div class="rc" id="room-display">????</div>
  </div>

  <div class="join-form">
    <label for="name-input">Ton prénom</label>
    <input id="name-input" type="text" placeholder="Ex: Léa" maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="join-btn" onclick="joinGame()">Rejoindre le jeu ! →</button>
  </div>
</div>

<!-- GAME -->
<div id="game-screen">
  <div class="game-header">
    <div class="player-dot"></div>
    <div id="player-name-display">???</div>
  </div>

  <div class="question-strip">
    <div class="qs-label">📋 Question</div>
    <div id="current-question">En attente d'une question…</div>
  </div>

  <div class="states">

    <!-- READY: buzzer -->
    <div id="state-ready">
      <div class="buzz-hint">Appuie dès que tu connais la réponse !</div>
      <button class="buzz-btn" onclick="doBuzz()">BUZZ!</button>
    </div>

    <!-- ANSWER: écrire la réponse -->
    <div id="state-answer">
      <div class="answer-card">
        <div class="ac-title">⚡ Tu as buzzé !</div>
        <div class="ac-sub">Écris ta réponse vite !</div>
        <input id="answer-input" type="text" placeholder="Ta réponse…" autocomplete="off" autocorrect="off" spellcheck="false" />
        <button class="send-answer-btn" onclick="sendAnswer()">Envoyer ma réponse !</button>
      </div>
    </div>

    <!-- WAITING: en attente du verdict -->
    <div id="state-waiting">
      <div class="waiting-card">
        <div class="wc-emoji">⏳</div>
        <div class="wc-title">En attente du verdict…</div>
        <div class="wc-label">Ta réponse</div>
        <div id="answer-given">…</div>
      </div>
    </div>

    <!-- LOST: quelqu'un d'autre a buzzé -->
    <div id="state-lost">
      <div class="lost-card">
        <div class="lc-emoji">😬</div>
        <div class="lc-title">Trop lent… c'est</div>
        <div id="lost-who">???</div>
        <div class="lc-sub">qui a buzzé en premier !</div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
